<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>E-Label</title>
<style>
  html, body { margin:0; height:100%; background:#fff; }
  body { display:flex; align-items:center; justify-content:center; }
  img { width:100vw; height:100vh; object-fit:contain; }
  img.refreshing { animation: flick .35s steps(2) infinite; }
  @keyframes flick { 0% { filter: invert(0); } 100% { filter: invert(1); } }
</style>
</head>
<body>
<img id="lbl" alt="E-Label" />
<script>
  // 全螢幕單一標籤：放在平板 / 手機上，擺在托盤右端給 ML 相機拍
  const id = decodeURIComponent(location.pathname.split('/').pop());
  const img = document.getElementById('lbl');
  const load = () => (img.src = '/label/' + encodeURIComponent(id) + '.svg?v=' + Date.now());
  load();
  const es = new EventSource('/sim/events');
  es.addEventListener('label', (e) => {
    const l = JSON.parse(e.data);
    if (l.barcode !== id) return;
    img.className = l.refreshing ? 'refreshing' : '';
    if (!l.refreshing) load();
  });
  document.addEventListener('dblclick', () => document.documentElement.requestFullscreen && document.documentElement.requestFullscreen());
</script>
</body>
</html>
