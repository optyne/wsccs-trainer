services:
  wsccs:
    build: .
    container_name: wsccs-trainer
    restart: unless-stopped
    ports:
      - "80:8080"          # 選手用 http://<主機IP>/ ，後台 http://<主機IP>/admin
    environment:
      - ADMIN_PASSWORD=change-me
      - TZ=Asia/Taipei
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads

  # eInk API 模擬器（取代中央工廠 192.168.10.2:3001）
  eink-sim:
    build: .
    container_name: eink-sim
    restart: unless-stopped
    command: ["node", "eink-sim/server.js"]
    ports:
      - "3001:3001"
    environment:
      - EINK_REFRESH_MS=4000
      # - EINK_TEAMS=team_25:password
      # - EINK_LABELS=8173E4476
